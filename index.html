<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt — Jejak Merdeka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flag-glow"></div>

  <main class="container">
    <header class="hero">
      <div class="jalur">🇲🇾 • JEJAK MERDEKA • 🇲🇾</div>
      <h1>Treasure Hunt</h1>
      <p>Panduan Hint & Code untuk Fasilitator</p>
    </header>

    <section class="notice">
      <div class="notice-icon">⚠️</div>
      <div>
        <h2>Arahan kepada Fasi-Fasi</h2>
        <p>
          <strong>Hanya layani peserta apabila peserta menyebut code
          di checkpoint yang betul.</strong>
          Jangan berikan hint atau bantuan tambahan sebelum code disahkan.
        </p>
      </div>
    </section>

    <section class="checkpoint-grid" id="checkpointGrid"></section>

    <footer>
      <span>JEJAK MERDEKA</span>
      <span>•</span>
      <span>RAHSIA FASI</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
